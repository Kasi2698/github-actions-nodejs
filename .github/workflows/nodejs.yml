name: Node.js CI

on:
  push:
    branches: [ main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

       - name: Start application
        run: |
          npm start > app.log 2>&1 &
          PID=$!
          sleep 5
          cat app.log
          kill $PID
